<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produk - Rainfall E-Commerce</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  
  <div class="top-bar">
    <span>Selamat datang di Rainfall E-commerce!</span>
    <div class="top-bar-links">
      <strong>Keranjang (<span id="cart-count">0</span>)</strong>
    </div>
  </div>

  <nav class="navbar">
    <h1 class="brand-logo"><span>Rainfall</span> E commerce</h1>
    <ul class="nav-menu">
      <li><a href="index.html">Beranda</a></li>
      <li><a href="product.html" class="active">Produk</a></li>
      <li><a href="about.html">Tentang Kami</a></li>
      <li><a href="kontak.html">Kontak & Admin</a></li>
    </ul>
    <div class="search-box">
      <input type="text" id="search-input" placeholder="Cari produk...">
      <button>Q</button>
    </div>
  </nav>

  <main class="main-content">
    <h3 class="section-title">Katalog Produk Tersedia</h3>
    <div class="product-grid" id="product-container">
      
      <div class="card">
        <img src="placeholder.jpg" alt="Tas Wanita Simple">
        <div class="card-info">
          <h4>Tas Wanita Simple</h4>
          <p class="price">Rp 150.000</p>
          <button class="btn-secondary">Tambah ke Keranjang</button>
        </div>
      </div>

      <div class="card">
        <img src="placeholder.jpg" alt="Jam Tangan Wanita">
        <div class="card-info">
          <h4>Jam Tangan Wanita</h4>
          <p class="price">Rp 120.000</p>
          <button class="btn-secondary">Tambah ke Keranjang</button>
        </div>
      </div>

      <div class="card">
        <img src="placeholder.jpg" alt="Sepatu Casual Putih">
        <div class="card-info">
          <h4>Sepatu Casual Putih</h4>
          <p class="price">Rp 200.000</p>
          <button class="btn-secondary">Tambah ke Keranjang</button>
        </div>
      </div>

      <div class="card">
        <img src="placeholder.jpg" alt="Hijab Segi Empat">
        <div class="card-info">
          <h4>Hijab Segi Empat</h4>
          <p class="price">Rp 35.000</p>
          <button class="btn-secondary">Tambah ke Keranjang</button>
        </div>
      </div>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
